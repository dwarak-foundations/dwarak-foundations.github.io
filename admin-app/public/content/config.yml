backend:
  name: github
  repo: dwarak-foundations/dwarak-foundations.github.io
  branch: main
  base_url: https://admin.dwarakfoundations.com
  auth_endpoint: /api/auth
  use_graphql: true

site_url: https://dwarakfoundations.com
display_url: https://dwarakfoundations.com
logo_url: https://dwarakfoundations.com/img/brand/dark.svg
publish_mode: editorial_workflow
media_folder: assets/img/uploads
public_folder: /img/uploads

collections:
  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} · {{status}} · {{location}}"
    sortable_fields: [order, title, status, completion]
    view_filters:
      - { label: Featured, field: featured, pattern: true }
      - { label: Completed, field: status, pattern: completed }
      - { label: Ongoing, field: status, pattern: ongoing }
      - { label: Upcoming, field: status, pattern: upcoming }
    editor:
      preview: false
    fields:
      - { label: Project name, name: title, widget: string }
      - { label: Summary, name: summary, widget: text, hint: A concise sentence used on the project page. }
      - { label: Location, name: location, widget: string, hint: "Example: Adyar, Chennai" }
      - { label: Full address, name: address, widget: text }
      - label: Status
        name: status
        widget: select
        options:
          - { label: Completed, value: completed }
          - { label: Ongoing, value: ongoing }
          - { label: Upcoming, value: upcoming }
      - { label: Completion, name: completion, widget: string, required: false, hint: "Example: January 2020" }
      - { label: Featured on home page, name: featured, widget: boolean, default: false }
      - { label: Display order, name: order, widget: number, value_type: int, default: 100, min: 1 }
      - label: Hero image
        name: hero
        widget: object
        fields:
          - { label: Image, name: src, widget: image }
          - { label: Alternative text, name: alt, widget: string, hint: Describe the building for visitors who cannot see it. }
      - label: Gallery
        name: gallery
        widget: list
        min: 1
        fields:
          - { label: Image, name: src, widget: image }
          - { label: Alternative text, name: alt, widget: string }
          - { label: Caption, name: caption, widget: string, required: false }
      - label: Project facts
        name: facts
        widget: list
        min: 1
        fields:
          - { label: Label, name: label, widget: string, hint: "Example: Homes" }
          - { label: Value, name: value, widget: string, hint: "Example: 6 apartments" }
      - { label: TNRERA number, name: rera, widget: string, required: false }
      - { label: Brochure, name: brochure, widget: file, required: false, media_folder: assets, public_folder: / }
      - label: Map coordinates
        name: coordinates
        widget: object
        fields:
          - { label: Latitude, name: latitude, widget: number, value_type: float, min: -90, max: 90, step: 0.000001 }
          - { label: Longitude, name: longitude, widget: number, value_type: float, min: -180, max: 180, step: 0.000001 }
      - { label: Google Maps embed URL, name: mapEmbed, widget: string }
      - { label: Legacy URL, name: legacyPath, widget: hidden, required: false, default: "" }
      - { label: Search description, name: seoDescription, widget: text, pattern: ['^.{80,170}$', 'Use between 80 and 170 characters.'] }
      - { label: Project narrative, name: body, widget: markdown }

  - name: testimonials
    label: Testimonials
    label_singular: Testimonial
    folder: src/content/testimonials
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{name}} · {{project}}"
    sortable_fields: [order, name, project]
    editor:
      preview: false
    fields:
      - { label: Client name, name: name, widget: string }
      - { label: Role, name: role, widget: string }
      - { label: Project, name: project, widget: string, required: false }
      - { label: Featured on home page, name: featured, widget: boolean, default: false }
      - { label: Display order, name: order, widget: number, value_type: int, default: 100, min: 1 }
      - { label: Testimonial, name: body, widget: markdown }
